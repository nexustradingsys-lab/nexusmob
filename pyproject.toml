[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-mobile"
version = "1.0.0"
description = "Standalone raw market-data acquisition service for Nexus Mobile"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "kiteconnect==5.2.1",
  "requests==2.34.2",
  "urllib3==2.7.0",
  "charset-normalizer==3.4.9",
  "idna==3.18",
  "certifi==2026.7.22",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
